# octomancer-sync as firmware. See firmware/CMakeLists.txt for what is built.

# --- C++ ---------------------------------------------------------------
#
# The program is ordinary C++ using std::string, std::vector and
# std::function, so it needs a real standard library rather than the minimal
# one. What it does not need is threads, and it could not have them anyway:
# src/loop.h records that this SDK's libstdc++ is built without
# _GLIBCXX_HAS_GTHREADS in every multilib variant, so std::thread and
# std::mutex do not exist on this target at all. That measurement is why the
# whole core is single-threaded.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_REQUIRES_FULL_LIBC=y

# Picolibc ships printf in two flavours and links the integer-only one unless
# asked. The integer-only one does not fail on "%f" -- it prints nothing for
# it, and returns success. So src/boxmsg.cc's set_double produced `offset=`
# with no number after it, for every offset, spread, uptime and drift figure
# this box has, while set_int worked and the build was clean and silent.
#
# The whole protocol is doubles. src/boxmsg.h's can_format_doubles() is run at
# boot and reported over the wire, so that this line going missing again is
# something the box says out loud rather than something a host has to infer
# from a conversation that has gone strange.
CONFIG_PICOLIBC_IO_FLOAT=y

# The roster and the message layer both allocate. 96 KB leaves room for the
# Bluetooth stack and still holds a bench of boxes with their sample windows;
# see kBoxMaxSamples in firmware/src/main.cc for the arithmetic.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=98304
# 16 KB, and the reason is worth writing down because eight was a considered
# number that turned out to be wrong for a reason nothing in this code makes
# visible.
#
# The whole box runs on this one stack: the loop, every callback it dispatches,
# the daemon underneath that, and the C library underneath that. Parsing a
# double is the deepest point -- picolibc's exact conversion uses the Ryu
# algorithm, which is generous with stack -- so a `time` message from a host
# was enough to push a chain that was already several frames deep past the end.
#
# It presented as a fault inside __double_computeInvPow5, which is the victim
# rather than the culprit: the MPU guard caught the function's own prologue
# pushing registers off the end. See firmware/src/faultlog.cc, which now names
# that case rather than reporting it as "unknown".
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=2048

# k_poll is the loop's wait -- firmware/src/loop_zephyr.cc.
CONFIG_POLL=y

# src/timeutil.cc uses localtime_r, which is the reentrant form and the only
# one that is safe to call at all. Picolibc has it behind this option.
CONFIG_POSIX_C_LANG_SUPPORT_R=y

# CONFIG_XSI_SINGLE_PROCESS is deliberately NOT set here, though it would make
# the build link. It supplies a gettimeofday backed by a system clock nothing
# on this device ever sets, so src/timeutil.cc's wall_now() would compile,
# link, and answer 1970 for the life of the program. firmware/src/boxclock.cc
# defines that symbol instead, from the clock the host actually gave us.

# --- the radio ---------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="octomancer"

# The box protocol over the air as well as down the cable, so that a dongle in
# a phone charger is a usable member of the system rather than something that
# has to stay tethered to a laptop. firmware/src/blepeer.h is the transport;
# src/syncd.h already keeps a list of peers, so this is simply another one and
# nothing on the box has to decide which is in charge.
#
# Observer and peripheral at once. The controller interleaves them, so
# advertising and holding a connection do cost scan time -- a box being talked
# to hears slightly fewer advertisements than one that is not. That is the
# right trade: the alternative is a box nobody can reach.
CONFIG_BT_PERIPHERAL=y
# Two connections, and only one of them is a host.
#
# One is the central that has come to talk to this box. The other is left for
# the camera, which this box will connect *out* to when it has a central role
# to do it with -- that is the next piece, and it is not here yet.
#
# Setting this to one today would work perfectly and then fail in a way that
# would take an evening to find: a camera sync that succeeded whenever nobody
# was connected over Bluetooth and failed silently whenever somebody was. The
# spare slot costs a little RAM now and no confusion later.
CONFIG_BT_MAX_CONN=2

# A bigger ATT MTU, so a device list is a handful of notifications rather than
# fifty. The default 23 leaves twenty bytes of payload, and a `dev` line is
# well over a hundred. blepeer.cc splits either way -- a notification is not a
# message boundary -- but splitting into twenty-byte pieces at one packet per
# connection interval is slow enough to notice.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# --- the wire ----------------------------------------------------------
#
# One CDC ACM port, carrying the box protocol and nothing else. The console is
# switched off rather than left alone: this board points its console at the
# same port, and Zephyr's boot banner alone would put "*** Booting Zephyr OS
# ***" in front of the greeting. Two writers on one wire is a protocol that
# cannot be parsed.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_LOG=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# DTR is the only evidence a serial port offers that a host is there, and
# firmware/src/cdcpeer.cc uses it as the peer's open and close.
CONFIG_UART_LINE_CTRL=y

# CONFIG_USBD_CDC_ACM_WORKQUEUE is deliberately NOT set, and the reasoning is
# worth keeping because it is a good argument that lost to evidence.
#
# The driver calls our "interrupt" handler from a workqueue rather than from an
# interrupt, and by default that is the *system* workqueue -- which is also
# where the USB stack answers control transfers. So anything stuck in
# cdcpeer.cc's isr() stops the device answering SET_CONTROL_LINE_STATE, and a
# host trying to open the port hangs forever against a dongle that still
# enumerates and still blinks. The driver offers a private queue for exactly
# that, and taking it looked obviously right.
#
# Then the image that took it never enumerated at all. Not a wedge -- absent
# from the bus, no flicker, nothing. The dedicated queue is the only thing in
# that image which runs before USB comes up: it starts a cooperative-priority
# thread from a POST_KERNEL SYS_INIT, and the USB device itself is brought up
# later, at APPLICATION. Everything else that changed runs after enumeration or
# only on a fault.
#
# That is an inference from init ordering and a config diff, not a proof -- the
# board cannot be instrumented while it is failing to enumerate, which is the
# whole difficulty. It is recorded as the suspect rather than the cause. What
# makes it safe to simply drop is that the reason for wanting it is now covered
# better: the watchdog below catches a starved workqueue and says so, which is
# more than this ever did.

# So that this dongle says what it is. Every Zephyr application on this board
# is called "CDC ACM serial backend" by default -- it is the board's generic
# name for its USB serial port, not any sample's -- and that is genuinely
# misleading: it is the string that made a running hci_uart look like a stock
# CDC sample for a day. A dongle running this firmware now says so.
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="octomancer-sync"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="octomancer"

# A sign of life, since there is no console to print one on.
CONFIG_GPIO=y

# So the box can be asked to reboot into its bootloader -- see
# firmware/src/boxadmin.h. Without this, replacing this image means holding a
# button while plugging the dongle in, which is per-board and easy to get
# wrong; doc/dongle-notes.md records a day lost to exactly that.
CONFIG_REBOOT=y

# --- the watchdog ------------------------------------------------------
#
# The last line of defence, and the only one that covers a box which has not
# crashed but has stopped. firmware/src/faultlog.cc catches a fault and
# reboots, but a workqueue that cannot run is not a fault: nothing throws,
# nothing faults, and the machine sits there enumerated and blinking with a
# port that will not open. Only a watchdog catches that.
#
# Once started it cannot be stopped or reconfigured until the chip resets, so
# see firmware/src/hwwatchdog.h before changing anything here.
CONFIG_WATCHDOG=y

# So the next boot can find out it was the watchdog that ended the last one.
# The reset cause is the only record there is: a watchdog reset leaves nothing
# behind of its own, because nothing is running at the moment it happens.
CONFIG_HWINFO=y
